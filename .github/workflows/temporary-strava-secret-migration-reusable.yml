name: Temporary Strava secret migration worker

on:
  workflow_call:
    secrets:
      MIGRATION_SOURCE_CLIENT_ID:
        required: true
      MIGRATION_SOURCE_CLIENT_SECRET:
        required: true
      MIGRATION_SOURCE_REFRESH_TOKEN:
        required: true
      STRAVA_TOKEN_STATE_WRITE_TOKEN:
        required: true

permissions: {}

jobs:
  migrate:
    if: github.repository == 'ncteisen/website' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: strava-sync
    timeout-minutes: 5
    concurrency:
      group: social-data-writer
      cancel-in-progress: false
    steps:
      - name: Copy original repository credentials into private environment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STRAVA_TOKEN_STATE_WRITE_TOKEN }}
          MIGRATION_SOURCE_CLIENT_ID: ${{ secrets.MIGRATION_SOURCE_CLIENT_ID }}
          MIGRATION_SOURCE_CLIENT_SECRET: ${{ secrets.MIGRATION_SOURCE_CLIENT_SECRET }}
          MIGRATION_SOURCE_REFRESH_TOKEN: ${{ secrets.MIGRATION_SOURCE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          for migration_name in GH_TOKEN MIGRATION_SOURCE_CLIENT_ID MIGRATION_SOURCE_CLIENT_SECRET MIGRATION_SOURCE_REFRESH_TOKEN; do
            if [[ -z "${!migration_name}" ]]; then
              printf 'Required secret input unavailable: %s\n' "$migration_name" >&2
              exit 1
            fi
          done
          if ! migration_conflict_count="$(gh api "repos/${GITHUB_REPOSITORY}/environments/strava-sync/secrets" --jq '[.secrets[].name | ascii_upcase | select(startswith("MIGRATION_SOURCE_") or . == "STRAVA_CLIENT_ID" or . == "STRAVA_CLIENT_SECRET" or . == "STRAVA_REFRESH_TOKEN")] | length' 2>/dev/null)"; then
            printf '%s\n' 'Cannot verify environment secret metadata; no credentials copied.' >&2
            exit 1
          fi
          if [[ "$migration_conflict_count" != '0' ]]; then
            printf '%s\n' 'Destination credentials or source aliases already exist; refusing migration.' >&2
            exit 1
          fi
          copy_secret() {
            local migration_destination="$1"
            local migration_source_name="$2"
            if ! printf '%s' "${!migration_source_name}" | gh secret set "$migration_destination" --repo "$GITHUB_REPOSITORY" --env strava-sync >/dev/null 2>&1; then
              printf 'Failed to copy %s; leave social sync disabled until migration is repaired.\n' "$migration_destination" >&2
              exit 1
            fi
            printf 'Copied %s\n' "$migration_destination"
          }
          copy_secret STRAVA_CLIENT_ID MIGRATION_SOURCE_CLIENT_ID
          copy_secret STRAVA_CLIENT_SECRET MIGRATION_SOURCE_CLIENT_SECRET
          copy_secret STRAVA_REFRESH_TOKEN MIGRATION_SOURCE_REFRESH_TOKEN
          printf '%s\n' 'Credential migration complete. No OAuth request or public data operation was performed.'
