name: Temporary migrate original Strava secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrate:
    if: github.repository == 'ncteisen/website' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/temporary-strava-secret-migration-reusable.yml
    # No environment here: capture the original repository values under names
    # that cannot collide with their destination environment secret names.
    secrets:
      MIGRATION_SOURCE_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      MIGRATION_SOURCE_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      MIGRATION_SOURCE_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      # Pass the normal names explicitly so the reusable environment job can
      # resolve its environment-only writer and current refresh-token value.
      STRAVA_TOKEN_STATE_WRITE_TOKEN: ${{ secrets.STRAVA_TOKEN_STATE_WRITE_TOKEN }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
