<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Archived CodeWords accessibility prototype</title>
  <meta name="description" content="Static examples from an early CodeWords accessibility experiment.">
  <link rel="stylesheet" href="styles/styles.css?v=1.0">
</head>

<body>
  <h1>Archived accessibility prototype</h1>
  <p>These are static historical examples. <a href="/codewords/">Play the current Codewords game.</a></p>
  <p>Option 1 (no change)</p>
  <div class="word" id="example-1"><div>crib</div></div>
  <p>Option 2 (alt=)</p>
  <div class="word" id="example-2" alt="blue crib"><div>crib</div></div>
  <p>Option 3 (trying using a tag)</p>
  <div><a href="#"><span class="ada">crib blue</span>crib</a></div>
  <p>Option 3.1 (trying using a tag variant)</p>
  <div><a href="#"><span class="ada">blue</span>crib</a></div>
</body>
</html>
